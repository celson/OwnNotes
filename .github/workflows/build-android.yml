name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android.yml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Signed Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Automated Tests
        run: npm test

      - name: Build Web Assets & Sync Capacitor
        run: npm run cap:build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          KEYSTORE_FILE="$RUNNER_TEMP/keystore/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using release keystore from GitHub Secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}" = "true" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured. Official release builds must use repository secrets."
            exit 1
          else
            echo "Generating ephemeral keystore for CI test build"
            RANDOM_PASS=$(head -c 32 /dev/urandom | base64)
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "ci-test" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -storepass "$RANDOM_PASS" \
              -keypass "$RANDOM_PASS" \
              -dname "CN=OwnNotes CI Test, OU=CI, O=OwnNotes, L=Test, ST=Test, C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$RANDOM_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=ci-test" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$RANDOM_PASS" >> $GITHUB_ENV
          fi

      - name: Build Signed Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace
          mkdir -p ../dist-apk
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../dist-apk/OwnNotes.apk
          else
            echo "Error: app-release.apk not found!"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OwnNotes-Android-APK
          path: dist-apk/OwnNotes.apk
          retention-days: 30

      # Rolling build of main. Published as a prerelease with make_latest: false so it
      # never takes the "Latest" badge from versioned v* releases: the in-app update
      # checker reads /releases/latest and must always get a semver tag.
      - name: Publish or Update Rolling Main Build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: OwnNotes (Build de desenvolvimento - main)
          body: |
            ### 📱 OwnNotes - Build de desenvolvimento (main)

            APK compilado em modo **Release** e assinado, gerado automaticamente a cada push na branch `main`.
            Para versões estáveis com instaladores de todas as plataformas, use a [última versão oficial](https://github.com/${{ github.repository }}/releases/latest).

            - 🔐 **Criptografia Zero-Knowledge**: XChaCha20-Poly1305 + BIP-39 (RAM exclusiva)
            - ⚡ **Supabase Cloud Sync**: Sincronização em tempo real entre dispositivos
            - 📝 **Editor Markdown TipTap**: Suporte completo a formatação, tarefas e realce de código

            **Instalação**: Baixe o arquivo `OwnNotes.apk` abaixo diretamente no seu celular Android.
          files: dist-apk/OwnNotes.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/OwnNotes.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
