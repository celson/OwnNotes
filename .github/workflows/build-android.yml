name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Automated Tests
        run: npm test

      - name: Build Web Assets & Sync Capacitor
        run: npm run cap:build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Prepare Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'ownnotes-release-2026' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'ownnotes' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'ownnotes-release-2026' }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          KEYSTORE_FILE="$RUNNER_TEMP/keystore/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using release keystore from GitHub Secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "IS_NEW_KEYSTORE=false" >> $GITHUB_ENV
          else
            echo "Generating consistent release keystore"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=OwnNotes, OU=Mobile, O=OwnNotes, L=Brasilia, ST=DF, C=BR"
            echo "IS_NEW_KEYSTORE=true" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV

      - name: Build Signed Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace
          mkdir -p ../dist-apk
          APP_VERSION=$(node -p "require('../package.json').version")
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../dist-apk/OwnNotes.apk
            cp app/build/outputs/apk/release/app-release.apk "../dist-apk/OwnNotes-v${APP_VERSION}.apk"
          else
            echo "Error: app-release.apk not found!"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OwnNotes-Android-APK
          path: dist-apk/*.apk
          retention-days: 30

      - name: Backup Generated Keystore
        if: env.IS_NEW_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OwnNotes-Release-Keystore
          path: ${{ env.KEYSTORE_PATH }}
          retention-days: 7

      - name: Publish or Update Latest Release on Main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: OwnNotes (Official Release APK)
          body: |
            ### 📱 OwnNotes - Aplicativo Android Oficial (Release)

            Versão compilada em modo **Release** e assinada oficialmente para Android.

            - 🔐 **Criptografia Zero-Knowledge**: XChaCha20-Poly1305 + BIP-39 (RAM exclusiva)
            - ⚡ **Supabase Cloud Sync**: Sincronização em tempo real entre dispositivos
            - 📝 **Editor Markdown TipTap**: Suporte completo a formatação, tarefas e realce de código

            **Instalação**: Baixe o arquivo `OwnNotes-v*.apk` ou `OwnNotes.apk` abaixo diretamente no seu celular Android.
          files: dist-apk/*.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
